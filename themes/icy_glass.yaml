# ─────────────────────────────────────────────────────────
#  Icy Glass — Home Assistant Theme
#  Light glassmorphic theme — frosted glass UI
# ─────────────────────────────────────────────────────────

Icy Glass:

  # ── Core palette ─────────────────────────────────────
  #  Background: icy blue-gray matte
  #  Cards: near-white
  #  Accent: dark navy (monochromatic)
  # ────────────────────────────────────────────────────

  primary-color: "#1c2b3a"
  accent-color: "#1c2b3a"
  primary-background-color: "#dfe6ef"
  secondary-background-color: "#e5ebf2"

  # ── Cards ────────────────────────────────────────────
  card-background-color: "#f2f5f9"
  ha-card-background: "#f2f5f9"
  ha-card-border-radius: "16px"
  ha-card-box-shadow: "0 2px 12px rgba(28, 43, 58, 0.06)"
  ha-card-border-width: "0px"
  ha-card-border-color: "transparent"

  # ── Text ─────────────────────────────────────────────
  primary-text-color: "#1c2b3a"
  secondary-text-color: "#7b8b9d"
  text-primary-color: "#ffffff"
  text-accent-color: "#1c2b3a"
  disabled-text-color: "#a8b4c0"

  # ── RGB variants (HA uses these for rgba calcs) ─────
  rgb-primary-color: "28, 43, 58"
  rgb-primary-text-color: "28, 43, 58"
  rgb-secondary-text-color: "123, 139, 157"
  rgb-card-background-color: "242, 245, 249"

  # ── Header / Toolbar ─────────────────────────────────
  app-header-background-color: "#dfe6ef"
  app-header-text-color: "#1c2b3a"
  app-header-border-bottom: "none"

  # ── Sidebar ──────────────────────────────────────────
  sidebar-background-color: "#dfe6ef"
  sidebar-icon-color: "#1c2b3a"
  sidebar-text-color: "#1c2b3a"
  sidebar-selected-background-color: "#1c2b3a"
  sidebar-selected-icon-color: "#ffffff"
  sidebar-selected-text-color: "#ffffff"

  # ── State icons ──────────────────────────────────────
  state-icon-color: "#1c2b3a"
  state-icon-active-color: "#1c2b3a"
  state-icon-unavailable-color: "#a8b4c0"
  state-active-color: "#1c2b3a"
  state-inactive-color: "#7b8b9d"

  # ── Switches & toggles ──────────────────────────────
  switch-checked-color: "#1c2b3a"
  switch-checked-button-color: "#ffffff"
  switch-checked-track-color: "#1c2b3a"
  switch-unchecked-button-color: "#c5ced8"
  switch-unchecked-track-color: "#d8dfe8"

  # ── Sliders ──────────────────────────────────────────
  paper-slider-knob-color: "#1c2b3a"
  paper-slider-active-color: "#1c2b3a"
  paper-slider-container-color: "#d8dfe8"
  paper-slider-secondary-color: "#8e9bab"

  # ── Toggle buttons ──────────────────────────────────
  paper-toggle-button-checked-bar-color: "#1c2b3a"
  paper-toggle-button-checked-button-color: "#1c2b3a"
  paper-toggle-button-unchecked-bar-color: "#c5ced8"
  paper-toggle-button-unchecked-button-color: "#d8dfe8"

  # ── Dialogs & popups ────────────────────────────────
  paper-dialog-background-color: "#edf0f5"
  paper-dialog-button-color: "#1c2b3a"

  # ── Inputs & forms ──────────────────────────────────
  paper-input-container-color: "#7b8b9d"
  paper-input-container-focus-color: "#1c2b3a"
  input-fill-color: "#e8ecf2"
  input-dropdown-icon-color: "#1c2b3a"
  input-ink-color: "#1c2b3a"
  input-label-ink-color: "#7b8b9d"

  # ── Tables ───────────────────────────────────────────
  table-row-background-color: "#f2f5f9"
  table-row-alternative-background-color: "#eaeff5"
  data-table-background-color: "#f2f5f9"

  # ── Badges ───────────────────────────────────────────
  label-badge-background-color: "#f2f5f9"
  label-badge-text-color: "#1c2b3a"
  label-badge-red: "#e74c3c"
  label-badge-green: "#27ae60"
  label-badge-blue: "#1c2b3a"
  label-badge-yellow: "#f39c12"
  label-badge-grey: "#95a5a6"

  # ── Dividers & borders ──────────────────────────────
  divider-color: "rgba(28, 43, 58, 0.06)"

  # ── Chips ────────────────────────────────────────────
  ha-chip-background-color: "#e8ecf2"
  ha-chip-text-color: "#1c2b3a"

  # ── Error / Warning / Info / Success ────────────────
  error-color: "#db4437"
  warning-color: "#e8a230"
  success-color: "#43a047"
  info-color: "#1c2b3a"

  # ── Energy colors ────────────────────────────────────
  energy-grid-consumption-color: "#1c2b3a"
  energy-grid-return-color: "#27ae60"
  energy-solar-color: "#f39c12"
  energy-battery-in-color: "#2980b9"
  energy-battery-out-color: "#8e44ad"
  energy-gas-color: "#e67e22"

  # ── Map ──────────────────────────────────────────────
  map-filter: "brightness(1.05) saturate(0.55)"

  # ── Code editor ──────────────────────────────────────
  code-editor-background-color: "#f2f5f9"
  codemirror-keyword: "#1c2b3a"
  codemirror-atom: "#2c3e50"
  codemirror-number: "#2980b9"
  codemirror-string: "#27ae60"
  codemirror-comment: "#95a5a6"
  codemirror-meta: "#8e44ad"
  codemirror-property: "#1c2b3a"

  # ── Markdown ─────────────────────────────────────────
  markdown-code-background-color: "#e8ecf2"

  # ── Material Design tokens ──────────────────────────
  mdc-theme-primary: "#1c2b3a"
  mdc-theme-secondary: "#1c2b3a"
  mdc-theme-surface: "#f2f5f9"
  mdc-theme-background: "#dfe6ef"
  mdc-theme-on-primary: "#ffffff"
  mdc-theme-on-secondary: "#ffffff"
  mdc-theme-on-surface: "#1c2b3a"

  # ── Ripple ───────────────────────────────────────────
  mdc-ripple-color: "#1c2b3a"

  # ── Buttons ──────────────────────────────────────────
  mdc-button-outline-color: "rgba(28, 43, 58, 0.12)"

  # ── Scrollbar ───────────────────────────────────────
  scrollbar-thumb-color: "rgba(28, 43, 58, 0.15)"

  # ── Lovelace background ─────────────────────────────
  lovelace-background: "#dfe6ef"

  # ──────────────────────────────────────────────────────
  #  Card-mod styles (optional — requires card-mod HACS)
  #  Adds glassmorphism backdrop-blur and soft edges
  # ──────────────────────────────────────────────────────

  card-mod-theme: Icy Glass

  card-mod-root-yaml: |
    ha-tabs$: |
      .not-scrollable {
        display: flex;
        justify-content: center;
      }
      paper-tab {
        color: #1c2b3a !important;
        font-weight: 500;
      }
      paper-tab[aria-selected="true"] {
        color: #1c2b3a !important;
        font-weight: 700;
      }
    .: |
      .header {
        background: rgba(223, 230, 239, 0.85) !important;
        backdrop-filter: blur(24px) saturate(1.2) !important;
        -webkit-backdrop-filter: blur(24px) saturate(1.2) !important;
        border-bottom: 1px solid rgba(255, 255, 255, 0.35) !important;
      }
      .toolbar {
        background: transparent !important;
      }

  card-mod-card-yaml: |
    .: |
      ha-card {
        background: rgba(242, 245, 249, 0.82) !important;
        backdrop-filter: blur(24px) saturate(1.2) !important;
        -webkit-backdrop-filter: blur(24px) saturate(1.2) !important;
        border: 1px solid rgba(255, 255, 255, 0.5) !important;
        transition: box-shadow 0.3s ease !important;
      }
      ha-card:hover {
        box-shadow: 0 4px 20px rgba(28, 43, 58, 0.09) !important;
      }

  card-mod-sidebar-yaml: |
    .: |
      :host {
        background: rgba(223, 230, 239, 0.9) !important;
        backdrop-filter: blur(24px) saturate(1.2) !important;
        -webkit-backdrop-filter: blur(24px) saturate(1.2) !important;
      }
      .menu .title {
        font-weight: 600 !important;
        color: #1c2b3a !important;
      }
      paper-icon-item {
        border-radius: 12px !important;
        margin: 2px 8px !important;
      }
      a[aria-selected="true"] paper-icon-item {
        background-color: #1c2b3a !important;
        border-radius: 12px !important;
      }
      a[aria-selected="true"] paper-icon-item ha-icon,
      a[aria-selected="true"] paper-icon-item ha-svg-icon {
        color: #ffffff !important;
      }
      a[aria-selected="true"] .item-text {
        color: #ffffff !important;
      }

  card-mod-more-info-yaml: |
    .: |
      :host {
        --ha-card-border-radius: 16px;
      }
