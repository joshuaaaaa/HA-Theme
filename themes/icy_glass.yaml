# ─────────────────────────────────────────────────────────
#  Icy Glass — Home Assistant Theme
#  Light glassmorphic theme — frosted glass UI
# ─────────────────────────────────────────────────────────

Icy Glass:

  # ── Core palette ─────────────────────────────────────
  #  Background: icy blue-gray
  #  Cards: frosted icy white (NOT pure white)
  #  Accent: dark navy (only for active/selected states)
  #  Icons: medium gray-blue
  # ────────────────────────────────────────────────────

  primary-color: "#1e2d3d"
  accent-color: "#1e2d3d"
  primary-background-color: "#e4ebf4"
  secondary-background-color: "#e9eff6"

  # ── Cards ────────────────────────────────────────────
  card-background-color: "#eef3f8"
  ha-card-background: "#eef3f8"
  ha-card-border-radius: "18px"
  ha-card-box-shadow: "0 2px 8px rgba(0, 0, 0, 0.03)"
  ha-card-border-width: "0px"
  ha-card-border-color: "transparent"

  # ── Text ─────────────────────────────────────────────
  primary-text-color: "#1e2d3d"
  secondary-text-color: "#8a96a5"
  text-primary-color: "#ffffff"
  text-accent-color: "#1e2d3d"
  disabled-text-color: "#b0b9c4"

  # ── RGB variants (HA uses these for rgba calcs) ─────
  rgb-primary-color: "30, 45, 61"
  rgb-primary-text-color: "30, 45, 61"
  rgb-secondary-text-color: "138, 150, 165"
  rgb-card-background-color: "238, 243, 248"

  # ── Header / Toolbar ─────────────────────────────────
  app-header-background-color: "#e4ebf4"
  app-header-text-color: "#1e2d3d"
  app-header-border-bottom: "none"

  # ── Sidebar ──────────────────────────────────────────
  #  Icons are medium gray-blue; only the selected item is dark navy
  sidebar-background-color: "#e4ebf4"
  sidebar-icon-color: "#6e7d8c"
  sidebar-text-color: "#6e7d8c"
  sidebar-selected-background-color: "#1e2d3d"
  sidebar-selected-icon-color: "#ffffff"
  sidebar-selected-text-color: "#ffffff"

  # ── State icons ──────────────────────────────────────
  state-icon-color: "#6e7d8c"
  state-icon-active-color: "#1e2d3d"
  state-icon-unavailable-color: "#b0b9c4"
  state-active-color: "#1e2d3d"
  state-inactive-color: "#6e7d8c"

  # ── Switches & toggles ──────────────────────────────
  switch-checked-color: "#1e2d3d"
  switch-checked-button-color: "#ffffff"
  switch-checked-track-color: "#1e2d3d"
  switch-unchecked-button-color: "#cdd4dc"
  switch-unchecked-track-color: "#dfe4eb"

  # ── Sliders ──────────────────────────────────────────
  paper-slider-knob-color: "#1e2d3d"
  paper-slider-active-color: "#1e2d3d"
  paper-slider-container-color: "#dfe4eb"
  paper-slider-secondary-color: "#6e7d8c"

  # ── Toggle buttons ──────────────────────────────────
  paper-toggle-button-checked-bar-color: "#1e2d3d"
  paper-toggle-button-checked-button-color: "#1e2d3d"
  paper-toggle-button-unchecked-bar-color: "#cdd4dc"
  paper-toggle-button-unchecked-button-color: "#dfe4eb"

  # ── Dialogs & popups ────────────────────────────────
  paper-dialog-background-color: "#f4f7fa"
  paper-dialog-button-color: "#1e2d3d"

  # ── Inputs & forms ──────────────────────────────────
  paper-input-container-color: "#6e7d8c"
  paper-input-container-focus-color: "#1e2d3d"
  input-fill-color: "#f0f4f8"
  input-dropdown-icon-color: "#1e2d3d"
  input-ink-color: "#1e2d3d"
  input-label-ink-color: "#6e7d8c"

  # ── Tables ───────────────────────────────────────────
  table-row-background-color: "#eef3f8"
  table-row-alternative-background-color: "#e9eff6"
  data-table-background-color: "#eef3f8"

  # ── Badges ───────────────────────────────────────────
  label-badge-background-color: "#eef3f8"
  label-badge-text-color: "#1e2d3d"
  label-badge-red: "#e74c3c"
  label-badge-green: "#27ae60"
  label-badge-blue: "#1e2d3d"
  label-badge-yellow: "#f39c12"
  label-badge-grey: "#6e7d8c"

  # ── Dividers & borders ──────────────────────────────
  divider-color: "rgba(0, 0, 0, 0.04)"

  # ── Chips ────────────────────────────────────────────
  ha-chip-background-color: "#f0f4f8"
  ha-chip-text-color: "#1e2d3d"

  # ── Error / Warning / Info / Success ────────────────
  error-color: "#db4437"
  warning-color: "#e8a230"
  success-color: "#43a047"
  info-color: "#1e2d3d"

  # ── Energy colors ────────────────────────────────────
  energy-grid-consumption-color: "#1e2d3d"
  energy-grid-return-color: "#27ae60"
  energy-solar-color: "#f39c12"
  energy-battery-in-color: "#2980b9"
  energy-battery-out-color: "#8e44ad"
  energy-gas-color: "#e67e22"

  # ── Map ──────────────────────────────────────────────
  map-filter: "brightness(1.05) saturate(0.55)"

  # ── Code editor ──────────────────────────────────────
  code-editor-background-color: "#eef3f8"
  codemirror-keyword: "#1e2d3d"
  codemirror-atom: "#2c3e50"
  codemirror-number: "#2980b9"
  codemirror-string: "#27ae60"
  codemirror-comment: "#6e7d8c"
  codemirror-meta: "#8e44ad"
  codemirror-property: "#1e2d3d"

  # ── Markdown ─────────────────────────────────────────
  markdown-code-background-color: "#f0f4f8"

  # ── Material Design tokens ──────────────────────────
  mdc-theme-primary: "#1e2d3d"
  mdc-theme-secondary: "#1e2d3d"
  mdc-theme-surface: "#eef3f8"
  mdc-theme-background: "#e4ebf4"
  mdc-theme-on-primary: "#ffffff"
  mdc-theme-on-secondary: "#ffffff"
  mdc-theme-on-surface: "#1e2d3d"

  # ── Ripple ───────────────────────────────────────────
  mdc-ripple-color: "#1e2d3d"

  # ── Buttons ──────────────────────────────────────────
  mdc-button-outline-color: "rgba(0, 0, 0, 0.08)"

  # ── Scrollbar ───────────────────────────────────────
  scrollbar-thumb-color: "rgba(0, 0, 0, 0.10)"

  # ── Lovelace background ─────────────────────────────
  lovelace-background: "#e4ebf4"

  # ──────────────────────────────────────────────────────
  #  Card-mod styles (optional — requires card-mod HACS)
  #  Adds glassmorphism backdrop-blur and softer edges
  # ──────────────────────────────────────────────────────

  card-mod-theme: Icy Glass

  card-mod-root-yaml: |
    ha-tabs$: |
      .not-scrollable {
        display: flex;
        justify-content: center;
      }
      paper-tab {
        color: #6e7d8c !important;
        font-weight: 500;
      }
      paper-tab[aria-selected="true"] {
        color: #1e2d3d !important;
        font-weight: 700;
      }
    .: |
      .header {
        background: rgba(228, 235, 244, 0.88) !important;
        backdrop-filter: blur(24px) saturate(1.2) !important;
        -webkit-backdrop-filter: blur(24px) saturate(1.2) !important;
        border-bottom: 1px solid rgba(255, 255, 255, 0.4) !important;
      }
      .toolbar {
        background: transparent !important;
      }

  card-mod-card-yaml: |
    .: |
      ha-card {
        background: rgba(238, 243, 248, 0.85) !important;
        backdrop-filter: blur(24px) saturate(1.2) !important;
        -webkit-backdrop-filter: blur(24px) saturate(1.2) !important;
        border: 1px solid rgba(255, 255, 255, 0.6) !important;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03) !important;
        transition: box-shadow 0.3s ease !important;
      }
      ha-card:hover {
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05) !important;
      }

  card-mod-sidebar-yaml: |
    .: |
      :host {
        background: rgba(228, 235, 244, 0.92) !important;
        backdrop-filter: blur(24px) saturate(1.2) !important;
        -webkit-backdrop-filter: blur(24px) saturate(1.2) !important;
      }
      .menu .title {
        font-weight: 600 !important;
        color: #1e2d3d !important;
      }
      paper-icon-item {
        border-radius: 12px !important;
        margin: 2px 8px !important;
      }
      paper-icon-item ha-icon,
      paper-icon-item ha-svg-icon {
        color: #6e7d8c !important;
      }
      .item-text {
        color: #6e7d8c !important;
      }
      a[aria-selected="true"] paper-icon-item {
        background-color: #1e2d3d !important;
        border-radius: 12px !important;
      }
      a[aria-selected="true"] paper-icon-item ha-icon,
      a[aria-selected="true"] paper-icon-item ha-svg-icon {
        color: #ffffff !important;
      }
      a[aria-selected="true"] .item-text {
        color: #ffffff !important;
      }

  card-mod-more-info-yaml: |
    .: |
      :host {
        --ha-card-border-radius: 18px;
      }
